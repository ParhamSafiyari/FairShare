<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FairShare</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1B2A4A">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png">

<!-- iOS: Safari doesn't read the manifest for install behavior, so these are set manually -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FairShare">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

  :root{
    --ink:#1B2A4A;
    --ink-soft:#334463;
    --paper:#EEF2ED;
    --card:#FDFEFC;
    --emerald:#2F9C6A;
    --emerald-bg:#E4F3EB;
    --coral:#E2593F;
    --coral-bg:#FBE9E5;
    --gold:#C98A2E;
    --slate:#5B6B73;
    --line:#DDE4DA;
    --shadow: 0 30px 60px -20px rgba(27,42,74,0.25), 0 2px 6px rgba(27,42,74,0.08);
    --radius: 18px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    padding:0;
    background:
      radial-gradient(ellipse at top, #F5F8F3 0%, var(--paper) 55%);
    min-height:100vh;
    font-family:var(--font-body);
    color:var(--ink);
  }

  body{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    padding:48px 16px 80px;
  }

  [dir="rtl"] body{ font-family:'Vazirmatn', sans-serif; }
  [dir="rtl"] .receipt{ font-family:'Vazirmatn', sans-serif; }

  .app{
    width:100%;
    max-width:460px;
  }

  /* ---------- Top bar ---------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
    padding:0 4px;
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand svg{ flex-shrink:0; }

  .brand-text{
    font-family:var(--font-display);
    font-weight:700;
    font-size:20px;
    letter-spacing:0.01em;
    color:var(--ink);
  }
  [dir="rtl"] .brand-text{ font-family:'Vazirmatn', sans-serif; font-weight:700; }

  .lang-toggle{
    display:flex;
    background:#fff;
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px;
    gap:2px;
    box-shadow: 0 1px 2px rgba(27,42,74,0.06);
  }

  .lang-toggle button{
    border:none;
    background:transparent;
    padding:6px 14px;
    border-radius:999px;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    color:var(--slate);
    cursor:pointer;
    transition:background .18s ease, color .18s ease;
  }
  [dir="rtl"] .lang-toggle button{ font-family:'Vazirmatn', sans-serif; }

  .lang-toggle button.active{
    background:var(--ink);
    color:#fff;
  }

  /* ---------- Receipt card ---------- */
  .receipt{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    overflow:hidden;
    position:relative;
  }

  .receipt-head{
    text-align:center;
    padding:28px 24px 18px;
  }

  .receipt-head .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:26px;
    letter-spacing:0.14em;
    color:var(--ink);
    margin:0 0 6px;
  }
  [dir="rtl"] .receipt-head .wordmark{ font-family:'Vazirmatn', sans-serif; letter-spacing:0; }

  .receipt-head .tagline{
    font-size:13px;
    color:var(--slate);
    margin:0;
  }

  .dash-rule{
    border:none;
    border-top:1.5px dashed var(--line);
    margin:0 24px;
  }

  .section{
    padding:20px 24px;
  }

  .section-label{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.09em;
    color:var(--gold);
    font-weight:600;
    margin:0 0 14px;
  }
  [dir="rtl"] .section-label{ font-family:'Vazirmatn', sans-serif; letter-spacing:0; }

  /* input row */
  .input-row{
    display:flex;
    gap:8px;
    margin-bottom:12px;
  }

  .input-row input{
    font-family:var(--font-body);
    font-size:14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    background:#fff;
    color:var(--ink);
    outline:none;
    transition:border-color .15s ease;
  }
  [dir="rtl"] .input-row input{ font-family:'Vazirmatn', sans-serif; }

  .input-row input:focus{
    border-color:var(--ink);
  }

  .input-row .name-field{ flex:1.3; min-width:0; }
  .input-row .amount-field{ flex:1; min-width:0; font-family:var(--font-mono); }

  .add-btn{
    flex-shrink:0;
    width:42px;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    font-size:20px;
    line-height:1;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .add-btn:hover{ background:var(--ink-soft); }
  .add-btn:active{ transform:scale(0.94); }

  /* line items */
  .items{
    display:flex;
    flex-direction:column;
    gap:2px;
  }

  .item-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:9px 2px;
    border-bottom:1px dotted var(--line);
    font-size:14px;
  }
  .item-row:last-child{ border-bottom:none; }

  .item-name{
    font-weight:500;
    color:var(--ink);
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding-inline-end:8px;
  }

  .item-amount{
    font-family:var(--font-mono);
    color:var(--ink-soft);
    flex-shrink:0;
  }

  .item-del{
    background:none;
    border:none;
    color:var(--coral);
    opacity:0.55;
    cursor:pointer;
    font-size:15px;
    padding:2px 0 2px 10px;
    line-height:1;
    transition:opacity .15s ease;
  }
  [dir="rtl"] .item-del{ padding:2px 10px 2px 0; }
  .item-del:hover{ opacity:1; }

  .empty-hint{
    font-size:13px;
    color:var(--slate);
    text-align:center;
    padding:10px 0 2px;
  }

  /* total row */
  .total-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:14px;
    padding-top:14px;
    border-top:1.5px solid var(--ink);
  }

  .total-row .label{
    font-family:var(--font-display);
    font-weight:600;
    font-size:14px;
    letter-spacing:0.06em;
    text-transform:uppercase;
  }
  [dir="rtl"] .total-row .label{ font-family:'Vazirmatn', sans-serif; letter-spacing:0; }

  .total-row .value{
    font-family:var(--font-mono);
    font-size:20px;
    font-weight:600;
  }

  .split-btn{
    width:100%;
    margin-top:18px;
    padding:13px;
    border:none;
    border-radius:12px;
    background:var(--emerald);
    color:#fff;
    font-family:var(--font-body);
    font-weight:600;
    font-size:15px;
    cursor:pointer;
    transition:background .15s ease, transform .1s ease;
  }
  [dir="rtl"] .split-btn{ font-family:'Vazirmatn', sans-serif; }
  .split-btn:hover{ background:#278658; }
  .split-btn:active{ transform:scale(0.99); }
  .split-btn:disabled{
    background:#B8C4BC;
    cursor:not-allowed;
  }

  /* ---------- perforated tear ---------- */
  .tear{
    position:relative;
    height:22px;
    background:
      radial-gradient(circle at 0 50%, var(--paper) 0, var(--paper) 7px, transparent 7.5px),
      radial-gradient(circle at 100% 50%, var(--paper) 0, var(--paper) 7px, transparent 7.5px),
      repeating-linear-gradient(90deg, var(--line) 0 8px, transparent 8px 16px);
    background-repeat:no-repeat, no-repeat, repeat-x;
    background-position: left center, right center, center;
    background-size: 14px 14px, 14px 14px, 100% 1.5px;
  }

  /* ---------- results ---------- */
  .balances{
    display:flex;
    flex-direction:column;
    gap:8px;
  }

  .balance-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 12px;
    border-radius:10px;
    font-size:14px;
  }

  .balance-row.owed{ background:var(--emerald-bg); }
  .balance-row.owes{ background:var(--coral-bg); }
  .balance-row.settled{ background:#F1F3EF; }

  .balance-row .who{ font-weight:600; color:var(--ink); }

  .balance-row .amt{
    font-family:var(--font-mono);
    font-weight:600;
  }
  .balance-row.owed .amt{ color:var(--emerald); }
  .balance-row.owes .amt{ color:var(--coral); }
  .balance-row.settled .amt{ color:var(--slate); }

  .balance-row .tag{
    font-size:11px;
    color:var(--slate);
    margin-inline-start:6px;
    font-weight:500;
  }

  .transactions{
    display:flex;
    flex-direction:column;
    gap:10px;
  }

  .tx-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:11px 12px;
    background:#fff;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:14px;
  }

  .tx-row .tx-names{
    flex:1;
    font-weight:500;
    display:flex;
    align-items:center;
    gap:6px;
    min-width:0;
  }
  .tx-row .tx-names span.who{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tx-row .arrow{ color:var(--gold); flex-shrink:0; }

  .tx-row .tx-amt{
    font-family:var(--font-mono);
    font-weight:600;
    color:var(--ink);
    flex-shrink:0;
  }

  .no-debts{
    font-size:14px;
    color:var(--slate);
    text-align:center;
    padding:8px 0;
  }

  /* ---------- footer / barcode ---------- */
  .receipt-foot{
    padding:22px 24px 26px;
    text-align:center;
  }

  .barcode{
    display:flex;
    justify-content:center;
    align-items:flex-end;
    gap:2px;
    height:30px;
    margin:0 auto 10px;
    width:fit-content;
  }
  .barcode span{
    display:block;
    width:2px;
    background:var(--ink);
    opacity:0.75;
  }

  .receipt-foot .thanks{
    font-size:12px;
    letter-spacing:0.05em;
    color:var(--slate);
    text-transform:uppercase;
  }
  [dir="rtl"] .receipt-foot .thanks{ font-family:'Vazirmatn', sans-serif; letter-spacing:0; text-transform:none; }

  .hidden{ display:none !important; }

  @media (max-width:480px){
    .receipt-head .wordmark{ font-size:22px; }
    .section{ padding:18px 18px; }
    .receipt-head{ padding:24px 18px 16px; }
    .dash-rule{ margin:0 18px; }
    .receipt-foot{ padding:20px 18px 22px; }
  }

  button:focus-visible, input:focus-visible{
    outline:2px solid var(--ink);
    outline-offset:2px;
  }

  /* ---------- install banner ---------- */
  .install-banner{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:18px 20px;
    margin-bottom:16px;
    display:flex;
    gap:14px;
    align-items:flex-start;
  }

  .install-banner .icon{
    flex-shrink:0;
    width:40px;
    height:40px;
    border-radius:10px;
    background:var(--ink);
    display:flex;
    align-items:center;
    justify-content:center;
  }

  .install-banner .content{ flex:1; min-width:0; }

  .install-banner .title{
    font-family:var(--font-display);
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    margin:0 0 4px;
  }
  [dir="rtl"] .install-banner .title{ font-family:'Vazirmatn', sans-serif; }

  .install-banner .steps{
    font-size:13px;
    color:var(--slate);
    margin:0;
    line-height:1.5;
  }

  .install-banner .steps .share-icon-inline{
    display:inline-block;
    vertical-align:-3px;
    margin:0 2px;
  }

  .install-banner .actions{
    display:flex;
    gap:8px;
    margin-top:10px;
  }

  .install-banner .btn-install{
    background:var(--emerald);
    color:#fff;
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13px;
    font-weight:600;
    font-family:var(--font-body);
    cursor:pointer;
  }
  [dir="rtl"] .install-banner .btn-install{ font-family:'Vazirmatn', sans-serif; }
  .install-banner .btn-install:hover{ background:#278658; }

  .install-banner .btn-dismiss{
    background:none;
    border:none;
    color:var(--slate);
    font-size:13px;
    font-family:var(--font-body);
    cursor:pointer;
    padding:8px 6px;
  }
  [dir="rtl"] .install-banner .btn-dismiss{ font-family:'Vazirmatn', sans-serif; }
  .install-banner .btn-dismiss:hover{ color:var(--ink); }

  /* ---------- expense form additions ---------- */
  .paidby-select{
    width:100%;
    font-family:var(--font-body);
    font-size:14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:11px 12px;
    background:#fff;
    color:var(--ink);
    outline:none;
  }
  [dir="rtl"] .paidby-select{ font-family:'Vazirmatn', sans-serif; }
  .paidby-select:focus{ border-color:var(--ink); }

  .split-among-label{
    font-size:12px;
    color:var(--slate);
    margin:10px 0 6px;
  }
  [dir="rtl"] .split-among-label{ font-family:'Vazirmatn', sans-serif; }

  .chips{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:12px;
  }

  .chip{
    font-size:13px;
    font-family:var(--font-body);
    padding:6px 12px;
    border-radius:999px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--slate);
    cursor:pointer;
    user-select:none;
    transition:background .15s ease, border-color .15s ease, color .15s ease;
  }
  [dir="rtl"] .chip{ font-family:'Vazirmatn', sans-serif; }
  .chip.selected{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  .split-mode-toggle{
    display:flex;
    gap:6px;
    margin-bottom:12px;
  }
  .mode-btn{
    flex:1;
    font-size:12.5px;
    font-family:var(--font-body);
    font-weight:600;
    padding:8px 10px;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    color:var(--slate);
    cursor:pointer;
  }
  [dir="rtl"] .mode-btn{ font-family:'Vazirmatn', sans-serif; }
  .mode-btn.selected{
    background:var(--ink);
    border-color:var(--ink);
    color:#fff;
  }

  .exact-amounts{
    margin-bottom:12px;
    padding:10px 12px;
    background:#F8FAF7;
    border-radius:10px;
    border:1.5px solid var(--line);
  }
  .exact-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:5px 0;
  }
  .exact-row .exact-name{
    font-size:13.5px;
    color:var(--ink);
    font-weight:500;
  }
  .exact-row input{
    width:90px;
    font-family:var(--font-mono);
    font-size:13px;
    border:1.5px solid var(--line);
    border-radius:8px;
    padding:6px 8px;
    text-align:right;
    background:#fff;
    color:var(--ink);
  }
  [dir="rtl"] .exact-row input{ text-align:left; }
  .exact-total-row{
    display:flex;
    justify-content:space-between;
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
    font-size:12.5px;
    font-weight:600;
  }
  [dir="rtl"] .exact-total-row{ font-family:'Vazirmatn', sans-serif; }
  .exact-total-row.balanced{ color:var(--emerald); }
  .exact-total-row.unbalanced{ color:var(--coral); }

  .add-btn.full-width{
    width:100%;
    height:auto;
    padding:11px;
    font-size:14px;
    font-weight:600;
    font-family:var(--font-body);
    margin-bottom:4px;
  }
  [dir="rtl"] .add-btn.full-width{ font-family:'Vazirmatn', sans-serif; }

  .expense-row{
    display:flex;
    flex-direction:column;
    padding:10px 2px;
    border-bottom:1px dotted var(--line);
    font-size:14px;
    gap:2px;
  }
  .expense-row:last-child{ border-bottom:none; }
  .expense-row .expense-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
  }
  .expense-row .expense-desc{ font-weight:500; color:var(--ink); }
  .expense-row .expense-amount{ font-family:var(--font-mono); color:var(--ink-soft); }
  .expense-row .expense-meta{
    font-size:12px;
    color:var(--slate);
    display:flex;
    justify-content:space-between;
    align-items:center;
  }

  /* ---------- group bar (save/share) ---------- */
  .group-bar{
    background:var(--card);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
    padding:16px 20px;
    margin-bottom:16px;
  }
  .group-bar:empty{ display:none; }

  .group-bar-label{
    font-size:13px;
    color:var(--slate);
    margin:0 0 8px;
  }
  [dir="rtl"] .group-bar-label{ font-family:'Vazirmatn', sans-serif; }

  .group-link-row{
    display:flex;
    gap:8px;
  }
  .group-link-row input{
    flex:1;
    min-width:0;
    font-family:var(--font-mono);
    font-size:12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    padding:9px 10px;
    background:#F8FAF7;
    color:var(--ink-soft);
  }
  .group-link-row .copy-btn{
    flex-shrink:0;
    border:none;
    border-radius:10px;
    background:var(--ink);
    color:#fff;
    font-family:var(--font-body);
    font-size:13px;
    font-weight:600;
    padding:9px 14px;
    cursor:pointer;
  }
  [dir="rtl"] .group-link-row .copy-btn{ font-family:'Vazirmatn', sans-serif; }
  .group-link-row .copy-btn:hover{ background:var(--ink-soft); }

  .group-live-indicator{
    font-size:12px;
    color:var(--slate);
    margin:10px 0 0;
    display:flex;
    align-items:center;
    gap:6px;
  }
  [dir="rtl"] .group-live-indicator{ font-family:'Vazirmatn', sans-serif; }
  .group-live-indicator .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--emerald);
    display:inline-block;
    animation:pulse-dot 2s ease-in-out infinite;
  }
  @keyframes pulse-dot{
    0%, 100% { opacity:1; }
    50% { opacity:0.35; }
  }

</style>
</head>
<body>

<div class="app" id="app" dir="ltr">

  <div class="topbar">
    <div class="brand">
      <svg width="26" height="26" viewBox="0 0 26 26" fill="none">
        <circle cx="13" cy="13" r="12" stroke="#1B2A4A" stroke-width="1.6"/>
        <path d="M8 13.5L11.2 16.7L18 9.5" stroke="#2F9C6A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="brand-text">FairShare</span>
    </div>
    <div class="lang-toggle">
      <button id="btn-en" class="active" onclick="setLang('en')">EN</button>
      <button id="btn-fa" onclick="setLang('fa')">فا</button>
    </div>
  </div>

  <div class="install-banner hidden" id="install-banner">
    <div class="icon">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
        <rect x="4" y="1.5" width="12" height="17" rx="2" stroke="white" stroke-width="1.4"/>
        <circle cx="10" cy="15.2" r="0.9" fill="white"/>
      </svg>
    </div>
    <div class="content">
      <p class="title" data-t="install_title">Get this on your phone</p>
      <p class="steps" id="install-steps"></p>
      <div class="actions">
        <button class="btn-install hidden" id="install-btn" data-t="install_btn">Install App</button>
        <button class="btn-dismiss" id="install-dismiss" data-t="install_dismiss">Not now</button>
      </div>
    </div>
  </div>

  <div class="group-bar" id="group-bar"></div>

  <div class="receipt">

    <div class="receipt-head">
      <p class="wordmark">F A I R S H A R E</p>
      <p class="tagline" data-t="tagline">Split the bill. Keep the friendship.</p>
    </div>

    <hr class="dash-rule">

    <div class="section">

    label_expense:      { en:"Add an expense", fa:"افزودن یک هزینه" },
    ph_desc:            { en:"What was it?", fa:"چه چیزی بود؟" },
    split_among_label:  { en:"Split between", fa:"تقسیم بین" },
    add_expense_btn:    { en:"Add expense", fa:"افزودن هزینه" },
    expenses_empty_hint:{ en:"No expenses yet.", fa:"هنوز هزینه‌ای ثبت نشده." },
    default_expense_label: { en:"Item", fa:"مورد" },
    save_group_btn:      { en:"Save as a group (sync with friends)", fa:"ذخیره به‌عنوان گروه (همگام‌سازی با دوستان)" },
    group_link_label:    { en:"Share this link with your friends:", fa:"این لینک را با دوستانتان به اشتراک بگذارید:" },
    copy_btn:            { en:"Copy", fa:"کپی" },
    copied_label:        { en:"Copied!", fa:"کپی شد!" },
    live_syncing:        { en:"Live syncing", fa:"همگام‌سازی زنده" },
    group_create_failed: { en:"Couldn't save this group. Check your connection and try again.", fa:"ذخیره گروه ممکن نشد. اتصال خود را بررسی کرده و دوباره امتحان کنید." },
    split_equal_btn:     { en:"Split equally", fa:"تقسیم مساوی" },
    split_exact_btn:     { en:"Exact amounts", fa:"مبلغ دقیق" },
    exact_balanced:      { en:"Balanced", fa:"متعادل" },
    exact_remaining_label: { en:"Remaining:", fa:"باقی‌مانده:" },
    exact_over_label:    { en:"Over by:", fa:"بیش از حد:" },
  };

  let TEXTS = FALLBACK_TEXTS;

  async function loadTexts(){
    try {
      const [en, fa] = await Promise.all([
        fetch('locales/en.json').then(r => { if (!r.ok) throw new Error('missing en.json'); return r.json(); }),
        fetch('locales/fa.json').then(r => { if (!r.ok) throw new Error('missing fa.json'); return r.json(); }),
      ]);
      const merged = {};
      Object.keys(en).forEach(key => {
        merged[key] = { en: en[key], fa: fa[key] };
      });
      TEXTS = merged;
    } catch (err) {
      // Likely opened as a local file:// URL, where fetch() of local JSON is blocked.
      // Falling back to the inline copy above keeps the app usable either way.
      console.warn('Could not load locales/*.json, using built-in fallback text.', err);
      TEXTS = FALLBACK_TEXTS;
    }
  }

  let LANG = 'en';
  let roster = [];    // { id, name }
  let expenses = [];  // { id, description, amount, paidBy: personId, participants: [personId, ...] }

  function newId(){
    // crypto.randomUUID is supported in all modern browsers. Using a random
    // id instead of an incrementing counter matters once a group is shared:
    // two people's phones adding items at the same time must never produce
    // the same id.
    return (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2));
  }

  // ---------- Group sync (Supabase) ----------
  const SUPABASE_URL = 'https://ggztzfodmabkcveyufgx.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_38NusaMMq02kcfT9hWZ9Gg_k4pD638S';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const GROUP_ACTION_URL = SUPABASE_URL + '/functions/v1/group-action';

  let currentGroupId = null;
  let realtimeChannel = null;

  function groupSecretKey(id){ return 'fairshare-secret-' + id; }
  function isGroupCreator(){
    return !!currentGroupId && localStorage.getItem(groupSecretKey(currentGroupId)) !== null;
  }
  function canDelete(){
    return !currentGroupId || isGroupCreator();
  }

  async function callGroupAction(payload){
    try {
      const res = await fetch(GROUP_ACTION_URL, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'apikey': SUPABASE_ANON_KEY,
          'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
        },
        body: JSON.stringify(payload),
      });
      return await res.json();
    } catch (err) {
      console.warn('Group sync request failed:', err);
      return { error: String(err) };
    }
  }

  function applyRemoteGroupState(row){
    roster = row.roster || [];
    expenses = row.expenses || [];
    renderRoster();
    renderExpenseForm();
    renderExpenses();
    hideResults();
  }

  function subscribeToGroup(groupId){
    if (realtimeChannel) sb.removeChannel(realtimeChannel);
    realtimeChannel = sb
      .channel('group-' + groupId)
      .on(
        'postgres_changes',
        { event: 'UPDATE', schema: 'public', table: 'groups', filter: 'id=eq.' + groupId },
        (payload) => applyRemoteGroupState(payload.new)
      )
      .subscribe();
  }

  async function loadGroup(groupId){
    const { data, error } = await sb.from('groups').select('*').eq('id', groupId).single();
    if (error || !data) {
      console.warn('Could not load group:', error);
      return false;
    }
    currentGroupId = groupId;
    applyRemoteGroupState(data);
    subscribeToGroup(groupId);
    renderGroupBar();
    return true;
  }

  async function saveAsGroup(){
    const groupId = newId().replace(/-/g, '').slice(0, 12);
    const secret = newId();

    const result = await callGroupAction({ action: 'create', groupId, secret, roster, expenses });
    if (result.error) {
      alert(t('group_create_failed'));
      return;
    }

    currentGroupId = groupId;
    localStorage.setItem(groupSecretKey(groupId), secret);

    const url = new URL(window.location.href);
    url.searchParams.set('group', groupId);
    window.history.replaceState({}, '', url);

    subscribeToGroup(groupId);
    renderGroupBar();
    renderRoster();
    renderExpenses();
  }

  function copyGroupLink(){
    const input = document.getElementById('group-link-input');
    if (!input) return;
    input.select();
    input.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(input.value).catch(() => {});

    const btn = document.getElementById('group-copy-btn');
    if (btn) {
      const original = btn.textContent;
      btn.textContent = t('copied_label');
      setTimeout(() => { btn.textContent = original; }, 1500);
    }
  }

  function renderGroupBar(){
    const bar = document.getElementById('group-bar');
    if (!bar) return;

    if (!currentGroupId) {
      bar.innerHTML = `<button class="add-btn full-width" onclick="saveAsGroup()">${t('save_group_btn')}</button>`;
      return;
    }

    const link = window.location.href;
    bar.innerHTML = `
      <p class="group-bar-label">${t('group_link_label')}</p>
      <div class="group-link-row">
        <input type="text" readonly value="${escapeHtml(link)}" id="group-link-input">
        <button class="copy-btn" id="group-copy-btn" onclick="copyGroupLink()">${t('copy_btn')}</button>
      </div>
      <p class="group-live-indicator"><span class="dot"></span> ${t('live_syncing')}</p>
    `;
  }

  function t(key){ return TEXTS[key][LANG]; }

  function fmt(n){
    return n.toLocaleString(undefined, { minimumFractionDigits:2, maximumFractionDigits:2 });
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  function personName(id){
    const p = roster.find(r => r.id === id);
    return p ? p.name : '?';
  }

  // ---------- Roster (who's splitting this outing) ----------
  function addRosterPerson(){
    const input = document.getElementById('roster-input');
    const name = input.value.trim();
    if (!name) { input.focus(); return; }

    const person = { id: newId(), name };
    roster.push(person);
    input.value = '';
    input.focus();

    renderRoster();
    renderExpenseForm();
    hideResults();

    if (currentGroupId) callGroupAction({ action: 'add_person', groupId: currentGroupId, item: person });
  }

  function removeRosterPerson(id){
    if (!canDelete()) return; // safety net - the button shouldn't even be visible in this case

    roster = roster.filter(p => p.id !== id);
    // Also drop this person from any expense they were paying or splitting.
    expenses = expenses.filter(e => e.paidBy !== id);
    expenses.forEach(e => { e.participants = e.participants.filter(pid => pid !== id); });
    expenses = expenses.filter(e => e.participants.length > 0);

    renderRoster();
    renderExpenseForm();
    renderExpenses();
    hideResults();

    if (currentGroupId) {
      callGroupAction({
        action: 'remove_person',
        groupId: currentGroupId,
        secret: localStorage.getItem(groupSecretKey(currentGroupId)),
        itemId: id,
      });
    }
  }

  function renderRoster(){
    const list = document.getElementById('roster-list');
    const hint = document.getElementById('roster-empty-hint');
    list.innerHTML = '';

    if (roster.length === 0){
      hint.classList.remove('hidden');
    } else {
      hint.classList.add('hidden');
      roster.forEach(p => {
        const row = document.createElement('div');
        row.className = 'item-row';
        const delBtn = canDelete()
          ? `<button class="item-del" aria-label="remove" onclick="removeRosterPerson('${p.id}')">✕</button>`
          : '';
        row.innerHTML = `
          <span class="item-name">${escapeHtml(p.name)}</span>
          ${delBtn}
        `;
        list.appendChild(row);
      });
    }
  }

  // ---------- Expense form (paid-by select + participant chips) ----------
  let selectedParticipants = new Set();
  let splitMode = 'equal'; // 'equal' | 'exact'
  let exactAmounts = {}; // { personId: "12.50" } - raw input strings, kept per person

  function renderExpenseForm(){
    const select = document.getElementById('expense-paidby');
    const previousValue = select.value;
    select.innerHTML = '';
    roster.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.id;
      opt.textContent = p.name;
      select.appendChild(opt);
    });
    if (roster.some(p => p.id === previousValue)) select.value = previousValue;

    // Default: everyone currently on the roster is selected to split a new expense.
    selectedParticipants = new Set(roster.map(p => p.id));
    exactAmounts = {};
    setSplitMode('equal');
  }

  function setSplitMode(mode){
    splitMode = mode;
    document.querySelectorAll('#split-mode-toggle .mode-btn').forEach(btn => {
      btn.classList.toggle('selected', btn.dataset.mode === mode);
    });
    document.getElementById('exact-amounts').classList.toggle('hidden', mode !== 'exact');
    renderParticipantChips();
    if (mode === 'exact') renderExactAmounts();
  }

  function renderParticipantChips(){
    const wrap = document.getElementById('participant-chips');
    wrap.innerHTML = '';
    roster.forEach(p => {
      const chip = document.createElement('span');
      chip.className = 'chip' + (selectedParticipants.has(p.id) ? ' selected' : '');
      chip.textContent = p.name;
      chip.onclick = () => {
        if (selectedParticipants.has(p.id)) selectedParticipants.delete(p.id);
        else selectedParticipants.add(p.id);
        renderParticipantChips();
        if (splitMode === 'exact') renderExactAmounts();
      };
      wrap.appendChild(chip);
    });
  }

  function renderExactAmounts(){
    const wrap = document.getElementById('exact-amounts');
    wrap.innerHTML = '';

    const selected = roster.filter(p => selectedParticipants.has(p.id));
    selected.forEach(p => {
      const row = document.createElement('div');
      row.className = 'exact-row';
      const value = exactAmounts[p.id] !== undefined ? exactAmounts[p.id] : '';
      row.innerHTML = `
        <span class="exact-name">${escapeHtml(p.name)}</span>
        <input type="number" min="0" step="0.01" placeholder="0.00" value="${escapeHtml(value)}" data-person="${p.id}">
      `;
      wrap.appendChild(row);
    });

    wrap.querySelectorAll('input[data-person]').forEach(input => {
      input.addEventListener('input', () => {
        exactAmounts[input.dataset.person] = input.value;
        updateExactTotalRow();
      });
    });

    const totalRow = document.createElement('div');
    totalRow.className = 'exact-total-row';
    totalRow.id = 'exact-total-row';
    wrap.appendChild(totalRow);

    updateExactTotalRow();
  }

  function updateExactTotalRow(){
    const totalRow = document.getElementById('exact-total-row');
    if (!totalRow) return;

    const targetAmount = parseFloat(document.getElementById('expense-amount').value) || 0;
    const enteredSum = Object.values(exactAmounts).reduce((sum, v) => sum + (parseFloat(v) || 0), 0);
    const diff = Math.round((targetAmount - enteredSum) * 100) / 100;

    if (Math.abs(diff) < 0.01) {
      totalRow.className = 'exact-total-row balanced';
      totalRow.textContent = '✓ ' + t('exact_balanced');
    } else if (diff > 0) {
      totalRow.className = 'exact-total-row unbalanced';
      totalRow.textContent = t('exact_remaining_label') + ' ' + fmt(diff);
    } else {
      totalRow.className = 'exact-total-row unbalanced';
      totalRow.textContent = t('exact_over_label') + ' ' + fmt(Math.abs(diff));
    }
  }

  function addExpense(){
    const descInput = document.getElementById('expense-desc');
    const amountInput = document.getElementById('expense-amount');
    const paidBySelect = document.getElementById('expense-paidby');

    const description = descInput.value.trim();
    const amount = parseFloat(amountInput.value);
    const paidBy = paidBySelect.value; // a roster id (string, not numeric) - do not parseInt this
    const participants = Array.from(selectedParticipants);

    if (roster.length < 2) return;
    if (isNaN(amount) || amount <= 0) { amountInput.focus(); return; }
    if (!paidBy) { return; }
    if (participants.length === 0) { return; }

    const expense = {
      id: newId(),
      description: description || t('default_expense_label'),
      amount,
      paidBy,
      participants,
    };

    if (splitMode === 'exact') {
      const enteredSum = participants.reduce((sum, pid) => sum + (parseFloat(exactAmounts[pid]) || 0), 0);
      if (Math.abs(Math.round((amount - enteredSum) * 100) / 100) >= 0.01) return; // not balanced - button should already be effectively disabled by the UI hint
      expense.shares = {};
      participants.forEach(pid => { expense.shares[pid] = Math.round((parseFloat(exactAmounts[pid]) || 0) * 100) / 100; });
    }

    expenses.push(expense);

    descInput.value = '';
    amountInput.value = '';
    descInput.focus();
    exactAmounts = {};
    setSplitMode('equal');

    renderExpenses();
    hideResults();

    if (currentGroupId) callGroupAction({ action: 'add_expense', groupId: currentGroupId, item: expense });
  }

  function removeExpense(id){
    if (!canDelete()) return; // safety net - the button shouldn't even be visible in this case

    expenses = expenses.filter(e => e.id !== id);
    renderExpenses();
    hideResults();

    if (currentGroupId) {
      callGroupAction({
        action: 'remove_expense',
        groupId: currentGroupId,
        secret: localStorage.getItem(groupSecretKey(currentGroupId)),
        itemId: id,
      });
    }
  }

  function renderExpenses(){
    const list = document.getElementById('expenses-list');
    const hint = document.getElementById('expenses-empty-hint');
    list.innerHTML = '';

    if (expenses.length === 0){
      hint.classList.remove('hidden');
    } else {
      hint.classList.add('hidden');
      expenses.forEach(e => {
        const row = document.createElement('div');
        row.className = 'expense-row';
        const participantNames = e.shares
          ? e.participants.map(pid => `${escapeHtml(personName(pid))} (${fmt(e.shares[pid] || 0)})`).join(', ')
          : e.participants.map(pid => escapeHtml(personName(pid))).join(', ');
        const delBtn = canDelete()
          ? `<button class="item-del" aria-label="remove" onclick="removeExpense('${e.id}')">✕</button>`
          : '';
        row.innerHTML = `
          <div class="expense-top">
            <span class="expense-desc">${escapeHtml(e.description)}</span>
            <span class="expense-amount">${fmt(e.amount)}</span>
          </div>
          <div class="expense-meta">
            <span>${escapeHtml(personName(e.paidBy))} → ${participantNames}</span>
            ${delBtn}
          </div>
        `;
        list.appendChild(row);
      });
    }

    const total = expenses.reduce((sum, e) => sum + e.amount, 0);
    document.getElementById('total-value').textContent = fmt(total);
    document.getElementById('split-btn').disabled = roster.length < 2 || expenses.length === 0;
  }

  function hideResults(){
    document.getElementById('results-block').classList.add('hidden');
  }

  function toBalancedCents(balances){
    // Rounding each person's balance to cents independently can leave the
    // group's total slightly off zero (e.g. splitting $100 seven ways).
    // This nudges the 1-2 cent difference onto whoever's rounding error was
    // largest, so the total always sums to exactly zero and everyone can be
    // fully settled - no stray pennies left unassigned to anyone.
    const raw = {};
    Object.keys(balances).forEach(k => { raw[k] = balances[k] * 100; });

    const rounded = {};
    let sum = 0;
    Object.keys(raw).forEach(k => { rounded[k] = Math.round(raw[k]); sum += rounded[k]; });

    if (sum !== 0){
      const errors = Object.keys(raw).map(k => ({ k, err: rounded[k] - raw[k] }));
      errors.sort((a, b) => sum > 0 ? b.err - a.err : a.err - b.err);
      let remaining = Math.abs(sum);
      let i = 0;
      while (remaining > 0 && i < errors.length){
        rounded[errors[i].k] += sum > 0 ? -1 : 1;
        remaining--;
        i++;
      }
    }
    return rounded;
  }

  function settleBalances(balances){
    // Works in integer cents rather than floating-point dollars. Floats caused
    // an infinite loop (and a frozen tab) whenever a bill didn't divide evenly
    // among people. The loop is also capped at n iterations as a hard
    // guarantee it can never hang, no matter what.
    const cents = toBalancedCents(balances);

    const transactions = [];
    const n = Object.keys(cents).length;

    for (let i = 0; i < n; i++){
      const entries = Object.entries(cents);
      let debtor = entries[0][0], creditor = entries[0][0];
      entries.forEach(([name, v]) => {
        if (v < cents[debtor]) debtor = name;
        if (v > cents[creditor]) creditor = name;
      });

      if (cents[debtor] >= 0 || cents[creditor] <= 0) break;

      const amountCents = Math.min(-cents[debtor], cents[creditor]);
      if (amountCents <= 0) break;

      transactions.push({ from: debtor, to: creditor, amount: amountCents / 100 });
      cents[debtor] += amountCents;
      cents[creditor] -= amountCents;
    }

    return transactions;
  }

  function splitBill(){
    if (roster.length < 2 || expenses.length === 0) return;

    // Each person's "paid" total and "owed" total are computed per-expense,
    // since different expenses can be split among different subsets of people
    // (e.g. cigarettes split only between the smokers, dinner split by everyone).
    const paidTotals = {};
    const owedTotals = {};
    roster.forEach(p => { paidTotals[p.id] = 0; owedTotals[p.id] = 0; });

    expenses.forEach(e => {
      paidTotals[e.paidBy] = (paidTotals[e.paidBy] || 0) + e.amount;
      if (e.shares) {
        // Exact-amount split: each participant owes precisely what was entered for them.
        e.participants.forEach(pid => {
          owedTotals[pid] = (owedTotals[pid] || 0) + (e.shares[pid] || 0);
        });
      } else {
        const share = e.amount / e.participants.length;
        e.participants.forEach(pid => {
          owedTotals[pid] = (owedTotals[pid] || 0) + share;
        });
      }
    });

    const balances = {};
    roster.forEach(p => { balances[p.name] = (paidTotals[p.id] || 0) - (owedTotals[p.id] || 0); });

    const transactions = settleBalances(balances);

    const balList = document.getElementById('balances-list');
    balList.innerHTML = '';
    roster.forEach(p => {
      const b = balances[p.name];
      let cls = 'settled', tag = t('settled');
      if (b > 0.01) { cls = 'owed'; tag = t('is_owed'); }
      else if (b < -0.01) { cls = 'owes'; tag = t('owes'); }

      const row = document.createElement('div');
      row.className = `balance-row ${cls}`;
      row.innerHTML = `
        <span class="who">${escapeHtml(p.name)} <span class="tag">${tag}</span></span>
        <span class="amt">${cls === 'settled' ? '—' : fmt(Math.abs(b))}</span>
      `;
      balList.appendChild(row);
    });

    const txList = document.getElementById('transactions-list');
    txList.innerHTML = '';
    if (transactions.length === 0){
      txList.innerHTML = `<p class="no-debts">${t('no_debts')}</p>`;
    } else {
      transactions.forEach(tx => {
        const row = document.createElement('div');
        row.className = 'tx-row';
        row.innerHTML = `
          <span class="tx-names">
            <span class="who">${escapeHtml(tx.from)}</span>
            <span class="arrow">${LANG === 'fa' ? '←' : '→'}</span>
            <span class="who">${escapeHtml(tx.to)}</span>
          </span>
          <span class="tx-amt">${fmt(tx.amount)}</span>
        `;
        txList.appendChild(row);
      });
    }

    document.getElementById('results-block').classList.remove('hidden');
  }

  function setLang(lang){
    LANG = lang;
    const app = document.getElementById('app');
    app.dir = (lang === 'fa') ? 'rtl' : 'ltr';
    document.getElementById('btn-en').classList.toggle('active', lang === 'en');
    document.getElementById('btn-fa').classList.toggle('active', lang === 'fa');

    document.querySelectorAll('[data-t]').forEach(el => {
      el.textContent = t(el.getAttribute('data-t'));
    });
    document.querySelectorAll('[data-t-ph]').forEach(el => {
      el.setAttribute('placeholder', t(el.getAttribute('data-t-ph')));
    });

    renderRoster();
    renderExpenseForm();
    renderExpenses();
    if (!document.getElementById('results-block').classList.contains('hidden')) {
      splitBill();
    }
    updateInstallStepsText();
    renderGroupBar();
  }
  function buildBarcode(){
    const bc = document.getElementById('barcode');
    const widths = [2,1,3,1,2,1,1,3,2,1,3,1,1,2,1,3,2,1,1,2,3,1,2,1];
    bc.innerHTML = '';
    widths.forEach(w => {
      const bar = document.createElement('span');
      const h = 14 + (w * 5);
      bar.style.height = h + 'px';
      bar.style.width = (w === 1 ? 1.5 : w === 2 ? 2.5 : 3.5) + 'px';
      bc.appendChild(bar);
    });
  }

  document.getElementById('roster-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') addRosterPerson();
  });
  document.getElementById('expense-amount').addEventListener('keydown', e => {
    if (e.key === 'Enter') addExpense();
  });
  document.getElementById('expense-amount').addEventListener('input', () => {
    if (splitMode === 'exact') updateExactTotalRow();
  });
  document.getElementById('expense-desc').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('expense-amount').focus();
  });

  async function init(){
    await loadTexts();
    setLang('en');
    buildBarcode();
    renderRoster();
    renderExpenseForm();
    renderExpenses();
    initInstallBanner();

    const urlGroupId = new URLSearchParams(window.location.search).get('group');
    if (urlGroupId) {
      const joined = await loadGroup(urlGroupId);
      if (!joined) renderGroupBar(); // couldn't load it - fall back to local mode, show "Save as a group"
    } else {
      renderGroupBar();
    }
  }

  init();

  // ---------- Install banner (Add to Home Screen guide) ----------
  let deferredInstallPrompt = null;

  function isStandaloneMode(){
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }
  function isIOS(){
    return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
  }
  function isAndroid(){
    return /android/i.test(navigator.userAgent);
  }

  function updateInstallStepsText(){
    const stepsEl = document.getElementById('install-steps');
    if (!stepsEl) return;
    if (deferredInstallPrompt) { stepsEl.textContent = ''; return; }
    stepsEl.textContent = isIOS() ? t('install_ios_steps') : t('install_android_steps');
  }

  function initInstallBanner(){
    if (isStandaloneMode()) return;
    if (!isIOS() && !isAndroid()) return;
    if (localStorage.getItem('fairshare-install-dismissed') === 'true') return;

    const banner = document.getElementById('install-banner');
    banner.classList.remove('hidden');
    updateInstallStepsText();

    document.getElementById('install-dismiss').addEventListener('click', () => {
      banner.classList.add('hidden');
      localStorage.setItem('fairshare-install-dismissed', 'true');
    });

    document.getElementById('install-btn').addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      if (choice.outcome === 'accepted') banner.classList.add('hidden');
    });
  }

  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    const installBtn = document.getElementById('install-btn');
    if (installBtn) installBtn.classList.remove('hidden');
    updateInstallStepsText();
  });

  // Register service worker so the app installs and works offline.
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch((err) => {
        console.warn('Service worker registration failed:', err);
      });
    });
  }

</script>
